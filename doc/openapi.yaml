---
openapi: 3.0.3
info:
  title: rails
  version: 1.0.0
servers:
- url: http://localhost:3000
  description: Default
paths:
  "/health_check":
    get:
      summary: index
      tags:
      - HealthCheck
      responses:
        '200':
          description: returns a successful ok status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                    required:
                    - status
                required:
                - data
              example:
                data:
                  status: ok
  "/v1/admin/brands":
    get:
      summary: index
      tags:
      - V1::Admin::Brand
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 10
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
        example: name
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
        example: asc
      responses:
        '200':
          description: returns a list of brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            description:
                              type: string
                            logo_url:
                              type: string
                            contact_email:
                              type: string
                            created_at:
                              type: string
                            updated_at:
                              type: string
                          required:
                          - id
                          - name
                          - description
                          - logo_url
                          - contact_email
                          - created_at
                          - updated_at
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          items:
                            type: integer
                          total_pages:
                            type: integer
                          total_items:
                            type: integer
                        required:
                        - page
                        - items
                        - total_pages
                        - total_items
                    required:
                    - items
                    - pagination
                required:
                - data
              example:
                data:
                  items:
                  - id: 1
                    name: Brand 1
                    description: Brand description
                    logo_url: https://example.com/logo.png
                    contact_email: brand@example.com
                    created_at: Sun, 09 Aug 2026 09:06:39 +0000
                    updated_at: Sun, 09 Aug 2026 09:06:39 +0000
                  - id: 2
                    name: Brand 2
                    description: Brand description
                    logo_url: https://example.com/logo.png
                    contact_email: brand@example.com
                    created_at: Sun, 09 Aug 2026 09:06:39 +0000
                    updated_at: Sun, 09 Aug 2026 09:06:39 +0000
                  - id: 3
                    name: Brand 3
                    description: Brand description
                    logo_url: https://example.com/logo.png
                    contact_email: brand@example.com
                    created_at: Sun, 09 Aug 2026 09:06:39 +0000
                    updated_at: Sun, 09 Aug 2026 09:06:39 +0000
                  pagination:
                    page: 1
                    items: 10
                    total_pages: 1
                    total_items: 3
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
      security:
      - BearerAuth: []
    post:
      summary: create
      tags:
      - V1::Admin::Brand
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                brand:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    logo_url:
                      type: string
                    contact_email:
                      type: string
                  required:
                  - name
                  - description
                  - logo_url
                  - contact_email
                name:
                  type: string
                description:
                  type: string
                logo_url:
                  type: string
                contact_email:
                  type: string
            example:
              brand:
                name: New Brand
                description: A new brand
                logo_url: http://example.com/logo.png
                contact_email: contact@example.com
              name: New Brand
              description: A new brand
              logo_url: http://example.com/logo.png
              contact_email: contact@example.com
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                logo_url:
                  type: string
                contact_email:
                  type: string
              required:
              - name
              - description
              - logo_url
              - contact_email
            example:
              name: New Brand
              description: A new brand
              logo_url: http://example.com/logo.png
              contact_email: contact@example.com
      responses:
        '201':
          description: creates a new brand
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      description:
                        type: string
                      logo_url:
                        type: string
                      contact_email:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - name
                    - description
                    - logo_url
                    - contact_email
                    - created_at
                    - updated_at
                required:
                - data
              example:
                data:
                  id: 7
                  name: New Brand
                  description: A new brand
                  logo_url: http://example.com/logo.png
                  contact_email: contact@example.com
                  created_at: Sun, 09 Aug 2026 09:06:39 +0000
                  updated_at: Sun, 09 Aug 2026 09:06:39 +0000
        '400':
          description: returns a 400 bad request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          contact_email:
                            type: array
                            items:
                              type: string
                        required:
                        - contact_email
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    contact_email:
                    - is in invalid format
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
        '422':
          description: returns a 422 unprocessable entity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          name:
                            type: array
                            items:
                              type: string
                        required:
                        - name
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: brand_not_created
                  message: Failed to create brand
                  details:
                    name:
                    - has already been taken
        '500':
          description: returns a 422 unprocessable entity status
          content:
            application/json:
              schema:
                type: object
                properties: {}
                required:
                - error
              example: {}
      security:
      - BearerAuth: []
  "/v1/login":
    post:
      summary: create
      tags:
      - V1::Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
            example:
              email: user@example.com
              password: correct-password
      responses:
        '200':
          description: returns 200 with an access token and the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                        required:
                        - id
                        - email
                    required:
                    - access_token
                    - user
                required:
                - data
              example:
                data:
                  access_token: 3gtHt2qvqNQcTHOtX6GTIIzmaWxPzXUhQU0duZV0535YC4OnhVWtsplPqCwC7G6+U7p7Ek4qo5tEl/h5pF3hLnAmpVUH71zhnUQb2vKkhHBjSZyIvHkPwHFzbX3ov9uIxcEWVpf/ULdtz79Xxs7/pCIBPCbIrJhuxGN2iSdi4UVD9rNtQJdy+N5fpqdoWJYXtlcS2rC10A==--uu3hXGel1xK9ydxK--zObHfND6VrL66z431h4Iug==
                  user:
                    id: 7
                    email: user@example.com
        '400':
          description: returns 400 with validation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            items:
                              type: string
                          password:
                            type: array
                            items:
                              type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    email:
                    - is in invalid format
                    password:
                    - is missing
        '401':
          description: returns 401 with an invalid_credentials error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: invalid_credentials
                  message: Invalid email or password
                  details:
                  - invalid credentials
  "/v1/logout":
    delete:
      summary: destroy
      tags:
      - V1::Session
      responses:
        '200':
          description: returns 200 with a confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                required:
                - data
              example:
                data:
                  message: Successfully logged out
        '401':
          description: returns 401 if the user is not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 401
                  code: unauthorized
                  message: Invalid token
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      description: 'Authenticate API requests via a JWT, e.g. "Authorization: Bearer
        <token>"'
      type: http
      scheme: bearer
      bearerFormat: JWT
