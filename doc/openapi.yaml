                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
      security:
      - BearerAuth: []
    post:
      summary: create
      tags:
      - V1::Admin::Product
      parameters:
      - name: brand_id
        in: path
        required: true
        schema:
          type: integer
        example: 17
      responses:
        '201':
          description: creates a new product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      price:
                        type: string
                      status:
                        type: string
                      brand_id:
                        type: integer
                      created_at:
