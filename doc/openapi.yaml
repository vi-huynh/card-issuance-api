  "/v1/login":
    post:
      summary: create
      tags:
      - V1::Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
            example:
              email: user@example.com
              password: correct-password
      responses:
        '200':
          description: returns 200 with an access token and the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                        required:
                        - id
                        - email
                    required:
                    - access_token
                    - user
                required:
                - data
              example:
                data:
                  access_token: BErUerOQApn2dpzi9S1Y1eg49awbO4Lx2OHWDv5cdwhlLZ9C3PX8xl4jZfx6UbCXPa6kxcp/KU08j/Ha//p0wAaVaCM0YGvI59E+QxT1aEG7hMFxFCVKcwhqOaTCUqod4scO4A8gaRv0o1kta2UIaxMcqjC8X4occD7+zM43qXTsl1dhjBUEv7MvSaJ9ZjUvZbcSbU+xvuM+--t7xOth3nc8bhF9Ma--JP6Z20OulCfQp3ivhJy00w==
                  user:
                    id: 25
                    email: user@example.com
        '400':
          description: returns 400 with validation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            items:
                              type: string
                          password:
                            type: array
                            items:
                              type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    email:
                    - is in invalid format
                    password:
                    - is missing
        '401':
          description: returns 401 with an invalid_credentials error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: invalid_credentials
                  message: Invalid email or password
                  details:
                  - invalid credentials
  "/v1/logout":
    delete:
      summary: destroy
      tags:
      - V1::Session
      responses:
        '200':
          description: returns 200 with a confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                required:
                - data
              example:
                data:
                  message: Successfully logged out
        '401':
          description: returns 401 if the user is not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 401
                  code: unauthorized
                  message: Invalid token
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      description: 'Authenticate API requests via a JWT, e.g. "Authorization: Bearer
        <token>"'
      type: http
      scheme: bearer
      bearerFormat: JWT
