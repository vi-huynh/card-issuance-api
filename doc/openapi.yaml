---
openapi: 3.0.3
info:
  title: rails
  version: 1.0.0
servers:
- url: http://localhost:3000
  description: Default
paths:
  "/v1/admin/report":
    get:
      summary: show
      tags:
      - V1::Admin::Report
      parameters:
      - name: brand_id
        in: query
        required: false
        schema:
          type: integer
        example: 23
      - name: client_id
        in: query
        required: false
        schema:
          type: integer
        example: 17
      - name: date_from
        in: query
        required: false
        schema:
          type: string
        example: '2026-01-01'
      - name: date_to
        in: query
        required: false
        schema:
          type: string
        example: '2026-01-01'
      responses:
        '200':
          description: includes all cards within the date range when no brand/client
            is given
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_card:
                        type: integer
                      total_card_issued:
                        type: integer
                      total_card_cancelled:
                        type: integer
                      total_issued_amount:
                        type: string
                      total_current_balance:
                        type: string
                      total_redeemed:
                        type: string
                    required:
                    - total_card
                    - total_card_issued
                    - total_card_cancelled
                    - total_issued_amount
                    - total_current_balance
                    - total_redeemed
                required:
                - data
              example:
                data:
                  total_card: 3
                  total_card_issued: 2
                  total_card_cancelled: 1
                  total_issued_amount: '60.0'
                  total_current_balance: '54.0'
                  total_redeemed: '6.0'
        '400':
          description: returns a 400 bad request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          date_from:
                            type: array
                            items:
                              type: string
                          date_to:
                            type: array
                            items:
                              type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    date_from:
                    - must be before or equal to date_to
                    date_to:
                    - is missing
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      description: 'Authenticate API requests via a JWT, e.g. "Authorization: Bearer
        <token>"'
      type: http
      scheme: bearer
      bearerFormat: JWT
