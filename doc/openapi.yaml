    post:
      summary: create
      tags:
      - V1::Admin::Client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                payout_rate:
                  type: number
                  format: float
              required:
              - name
              - email
              - payout_rate
            example:
              name: Acme Client
              email: acme@example.com
              payout_rate: 15.5
      responses:
        '201':
          description: creates a new client
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      payout_rate:
                        type: string
                      status:
                        type: string
                      user_id:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      invite_token:
                        type: string
                    required:
                    - id
                    - name
                    - payout_rate
                    - status
                    - user_id
                    - created_at
                    - updated_at
                required:
                - data
              example:
                data:
                  id: 7
                  name: Acme Client
                  payout_rate: '15.5'
                  status: pending
                  user_id: 16
                  created_at: Mon, 10 Aug 2026 09:56:26 +0000
                  updated_at: Mon, 10 Aug 2026 09:56:26 +0000
                  invite_token: 75e0e905c0a189f89e8daf1d8013b37a0925d31c13d6a5757b5a9b6aca95a478
        '400':
          description: returns a 400 bad request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          payout_rate:
                            type: array
                            items:
                              type: string
                          name:
                            type: array
                            items:
                              type: string
                          email:
                            type: array
                            items:
                              type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    payout_rate:
                    - must be less than or equal to 100
                    name:
                    - must be filled
                    email:
                    - is invalid
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
        '422':
          description: returns a 422 unprocessable entity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            items:
                              type: string
                        required:
                        - email
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: client_not_created
                  message: Failed to create client
                  details:
                    email:
                    - has already been taken
      security:
      - BearerAuth: []
  "/v1/login":
    post:
      summary: create
      tags:
      - V1::Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
