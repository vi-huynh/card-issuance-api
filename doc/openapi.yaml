              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            items:
                              type: string
                          password:
                            type: array
                            items:
                              type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    email:
                    - is in invalid format
                    password:
                    - is missing
