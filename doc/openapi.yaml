                    - total_card_cancelled
                    - total_issued_amount
                    - total_current_balance
                    - total_redeemed
                required:
                - data
              example:
                data:
                  total_card: 0
                  total_card_issued: 0
                  total_card_cancelled: 0
                  total_issued_amount: '0.0'
                  total_current_balance: '0.0'
                  total_redeemed: '0.0'
        '400':
          description: returns a 400 bad request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          date_from:
                            type: array
                            items:
                              type: string
                          date_to:
                            type: array
                            items:
                              type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    date_from:
                    - must be before or equal to date_to
                    date_to:
                    - is missing
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
      security:
      - BearerAuth: []
  "/v1/login":
    post:
      summary: create
      tags:
      - V1::Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
            example:
              email: admin@example.com
              password: Admin@2026
      responses:
        '200':
          description: returns 200 with an access token and the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                        required:
                        - id
                        - email
                    required:
                    - access_token
                    - user
                required:
                - data
              example:
                data:
                  access_token: R67L26oE4evkvcdDXJ0kGM2QzQ6gfViZWFnN3W60YjBTW9rrfnWUG2BCbA92a2XHdIo4MTLl/0b6nA0JzhgSOmCTF06DRP5BOTbuRwusikFo4/JLwbAdrNT/xYXmfM3nFnW/AGFEX5/E/+hWtPSS5pMEAZC+MVxYhng49KFbBuvgWwQWcbGFTnTPo4jmDccCe4kOXZODWMGTZw==--bh/tEwrCiuTRjZPE--mxJBAZhdT6J1YeBG3ZvGCA==
                  user:
                    id: 111
                    email: admin@example.com
        '400':
          description: returns 400 with validation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            items:
                              type: string
                          password:
                            type: array
                            items:
                              type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    email:
                    - is in invalid format
                    password:
                    - is missing
        '401':
          description: returns 401 with an invalid_credentials error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: invalid_credentials
                  message: Invalid email or password
                  details:
                  - invalid credentials
  "/v1/logout":
    delete:
      summary: destroy
      tags:
      - V1::Session
      responses:
        '200':
          description: returns 200 with a confirmation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                required:
                - data
              example:
                data:
                  message: Successfully logged out
        '401':
          description: returns 401 if the user is not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 401
                  code: unauthorized
                  message: Invalid token
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      description: 'Authenticate API requests via a JWT, e.g. "Authorization: Bearer
        <token>"'
      type: http
      scheme: bearer
      bearerFormat: JWT
