          description: returns a 400 bad request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          name:
                            type: array
                            items:
                              type: string
                        required:
                        - name
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    name:
                    - must be filled
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
        '422':
          description: returns a 422 unprocessable entity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          brand:
                            type: array
                            items:
                              type: string
                        required:
                        - brand
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: product_not_created
                  message: Failed to create product
                  details:
                    brand:
                    - must exist
        '500':
          description: returns a 422 unprocessable entity status
          content:
            application/json:
              schema:
                type: object
                properties: {}
                required:
                - error
              example: {}
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                  format: float
                brand_id:
                  type: integer
                description:
                  type: string
              required:
              - name
              - price
              - brand_id
            example:
              name: New Product
              price: 9.99
              brand_id: 14
              description: A new product
