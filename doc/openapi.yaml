---
openapi: 3.0.3
info:
  title: rails
  version: 1.0.0
servers:
- url: http://localhost:3000
  description: Default
paths:
  "/health_check":
    get:
      summary: index
      tags:
      - HealthCheck
      responses:
        '200':
          description: returns a successful ok status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                    required:
                    - status
                required:
                - data
              example:
                data:
                  status: ok
  "/v1/admin/brands":
    get:
      summary: index
      tags:
      - V1::Admin::Brand
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 10
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
        example: name
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
        example: asc
      responses:
        '200':
          description: returns a list of brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            description:
                              type: string
                            logo_url:
                              type: string
                            contact_email:
                              type: string
                            created_at:
                              type: string
                            updated_at:
                              type: string
                          required:
                          - id
                          - name
                          - description
                          - logo_url
                          - contact_email
                          - created_at
                          - updated_at
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          items:
                            type: integer
                          total_pages:
                            type: integer
                          total_items:
                            type: integer
                        required:
                        - page
                        - items
                        - total_pages
                        - total_items
                    required:
                    - items
                    - pagination
                required:
                - data
              example:
                data:
                  items:
                  - id: 1
                    name: Brand 1
                    description: Brand description
                    logo_url: https://example.com/logo.png
                    contact_email: brand@example.com
                    created_at: Mon, 10 Aug 2026 05:14:26 +0000
                    updated_at: Mon, 10 Aug 2026 05:14:26 +0000
                  - id: 2
                    name: Brand 2
                    description: Brand description
                    logo_url: https://example.com/logo.png
                    contact_email: brand@example.com
                    created_at: Mon, 10 Aug 2026 05:14:26 +0000
                    updated_at: Mon, 10 Aug 2026 05:14:26 +0000
                  - id: 3
                    name: Brand 3
                    description: Brand description
                    logo_url: https://example.com/logo.png
                    contact_email: brand@example.com
                    created_at: Mon, 10 Aug 2026 05:14:26 +0000
                    updated_at: Mon, 10 Aug 2026 05:14:26 +0000
                  pagination:
                    page: 1
                    items: 10
                    total_pages: 1
                    total_items: 3
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
      security:
      - BearerAuth: []
    post:
      summary: create
      tags:
      - V1::Admin::Brand
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                logo_url:
                  type: string
                contact_email:
                  type: string
              required:
              - name
              - description
              - logo_url
              - contact_email
            example:
              name: New Brand
              description: A new brand
              logo_url: http://example.com/logo.png
              contact_email: contact@example.com
      responses:
        '201':
          description: creates a new brand
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      description:
                        type: string
                      logo_url:
                        type: string
                      contact_email:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - name
                    - description
                    - logo_url
                    - contact_email
                    - created_at
                    - updated_at
                required:
                - data
              example:
                data:
                  id: 7
                  name: New Brand
                  description: A new brand
                  logo_url: http://example.com/logo.png
                  contact_email: contact@example.com
                  created_at: Mon, 10 Aug 2026 05:14:26 +0000
                  updated_at: Mon, 10 Aug 2026 05:14:26 +0000
        '400':
          description: returns a 400 bad request status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          contact_email:
                            type: array
                            items:
                              type: string
                        required:
                        - contact_email
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: bad_request
                  message: Invalid request
                  details:
                    contact_email:
                    - is in invalid format
        '403':
          description: returns a 403 forbidden status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      status:
                        type: integer
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - status
                    - code
                    - message
                required:
                - error
              example:
                error:
                  status: 403
                  code: forbidden
                  message: You are not authorized to perform this action
        '422':
          description: returns a 422 unprocessable entity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                        properties:
                          name:
                            type: array
                            items:
                              type: string
                        required:
                        - name
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              example:
                error:
                  code: brand_not_created
                  message: Failed to create brand
                  details:
                    name:
                    - has already been taken
      security:
      - BearerAuth: []
